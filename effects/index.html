<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nomi — effects preview</title>
<link rel="preload" href="fonts/DMSans-Medium.woff2" as="font" type="font/woff2" crossorigin>
<script>matchMedia("(prefers-reduced-motion: reduce)").matches || (document.documentElement.dataset.intro = "")</script>
<link rel="stylesheet" href="effects.css?v=4">
<link rel="stylesheet" href="island.css?v=5">
<style>
  @font-face{font-family:"DM Sans";src:url(fonts/DMSans-Medium.woff2) format("woff2");font-weight:500;font-display:swap}
  @font-face{font-family:Inter;src:url(fonts/Inter-Regular.woff2) format("woff2");font-weight:400;font-display:swap}
  @font-face{font-family:Inter;src:url(fonts/Inter-Medium.woff2) format("woff2");font-weight:500;font-display:swap}
  :root{--out:cubic-bezier(.16,1,.3,1);--paper:#f6f2ea;--ink:#1f1b18;--muted:#5f5750;--line:#e2dacf;--gutter:clamp(20px,5vw,76px)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif}
  .wrap{max-width:1568px;margin:0 auto;padding:0 var(--gutter)}
  .site-header{position:absolute;inset:0 0 auto;z-index:3}
  .nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:72px}
  .brand{justify-self:start;font:500 21px/1 "DM Sans",Inter,system-ui,sans-serif;letter-spacing:-.03em;color:var(--ink);text-decoration:none}
  .links{display:flex;gap:4px}
  .links a{padding:8px 14px;border-radius:999px;font-size:15px;font-weight:500;color:var(--muted);text-decoration:none;transition:color .15s,background .15s}
  .links a:hover{color:var(--ink);background:rgba(31,27,24,.05)}
  .links a[aria-current]{color:var(--ink)}
  .nav-end{justify-self:end;display:flex;align-items:center;gap:8px}
  .nav .cta-sm{font-size:15px;padding:10px 18px;border-radius:999px;background:var(--ink);color:var(--paper);text-decoration:none;font-weight:500}
  .menu-btn{display:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.55);cursor:pointer;place-content:center;gap:5px;padding:0}
  .menu-btn i{display:block;width:16px;height:1.5px;background:var(--ink);border-radius:1px;transition:translate .2s,rotate .2s}
  .site-header[data-open] .menu-btn i:first-child{translate:0 3.25px;rotate:45deg}
  .site-header[data-open] .menu-btn i:last-child{translate:0 -3.25px;rotate:-45deg}
  .hero{min-height:100vh;padding-top:72px}
  h1,h2{font-family:"DM Sans",Inter,system-ui,sans-serif;font-weight:500;margin:0;letter-spacing:-.035em}
  .hero-top{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:end;align-items:last baseline;padding:clamp(48px,12vh,140px) 0 48px;border-bottom:1px solid var(--line)}
  h1{font-size:clamp(42px,5vw,76px);line-height:1.02;max-width:9.5em;text-wrap:balance}
  .sub{justify-self:end;max-width:500px;margin:0;font-size:clamp(17px,1.45vw,21px);line-height:1.5;color:var(--muted)}
  .ctas{display:flex;gap:14px;flex-wrap:wrap;padding:46px 0 46px}
  .btn{display:inline-flex;align-items:center;gap:12px;height:46px;padding:0 20px;border-radius:999px;font-size:16px;font-weight:500;text-decoration:none}
  .btn-primary{background:var(--ink);color:var(--paper);padding-left:7px}
  .btn-primary .arrow{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--paper);color:var(--ink);overflow:hidden;transition:scale .25s var(--out)}
  .btn-primary .arrow svg{transition:translate .25s var(--out)}
  .btn-primary:hover .arrow{scale:1.06}
  .btn-primary:hover .arrow svg{translate:2px 0}
  .btn{transition:scale .15s ease}
  .btn:active{scale:.98}
  .footer{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;padding-top:28px;padding-bottom:36px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
  .footer nav{display:flex;flex-wrap:wrap;gap:6px 24px}
  .footer a{color:var(--muted);text-decoration:none}
  .footer a:hover{color:var(--ink)}
  .btn-secondary{background:none;color:var(--ink);padding:0 8px;gap:6px}
  .btn-secondary::after{content:"";width:6px;height:6px;border:solid currentColor;border-width:1.5px 1.5px 0 0;rotate:45deg;margin-left:2px;transition:translate .15s}
  .btn-secondary:hover::after{translate:2px 0}
  .stage{border-radius:22px 22px 0 0;padding:clamp(24px,4.5vw,70px) clamp(16px,3vw,46px) 0;background:linear-gradient(180deg,#e9ddd0,#dccbbb);overflow:hidden}
  .window{height:360px;border-radius:14px 14px 0 0;background:#1d1a17;box-shadow:0 30px 80px -30px rgba(40,25,10,.45);display:flex;flex-direction:column;align-items:flex-start;padding:18px 22px;color:#b9afa4;font-size:14px;text-align:left;gap:12px}
  .dots{display:flex;gap:7px}.dots i{width:11px;height:11px;border-radius:50%;background:#3a342e;display:block}
  .q{background:#2a2521;border-radius:10px;padding:10px 14px;color:#e8e0d6}
  h2{font-size:clamp(34px,4.6vw,56px);line-height:1.1;max-width:900px}
  [data-intro] .site-header{opacity:0}
  [data-intro] [data-stitch-reveal]:not([data-state]){color:transparent}
  [data-intro] [data-rise]{opacity:0;translate:0 14px;filter:blur(6px)}
  [data-intro] .stage{opacity:0;translate:0 64px}
  [data-intro] .mi-screen{filter:brightness(.18) saturate(.6)}
  [data-intro=go] .site-header{opacity:1;transition:opacity .8s ease .1s}
  [data-intro=go] [data-rise]{opacity:1;translate:0 0;filter:blur(0);transition:opacity .7s var(--out) var(--d),translate 1s var(--out) var(--d),filter .7s var(--out) var(--d)}
  [data-intro=go] .stage{opacity:1;translate:0 0;transition:opacity 1s var(--out) 1.1s,translate 1.4s var(--out) 1.1s}
  [data-intro=go] .mi-screen{filter:none;transition:filter 1.1s ease 1.8s}
  @media (max-width:820px){
    .nav{grid-template-columns:1fr auto}
    .menu-btn{display:grid}
    .links{display:none;position:absolute;top:64px;left:var(--gutter);right:var(--gutter);flex-direction:column;gap:0;padding:8px;background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 40px -18px rgba(40,25,10,.25)}
    .site-header[data-open] .links{display:flex}
    .links a{padding:12px 14px;font-size:17px;border-radius:10px}
    .hero{min-height:0}
    .hero-top{grid-template-columns:1fr;gap:20px;padding:56px 0 0;border-bottom:0}
    .sub{justify-self:start}
    .ctas{gap:10px;padding:28px 0 36px}
    .footer{flex-direction:column;align-items:flex-start}
    .btn{height:44px;font-size:15px;padding:0 18px}
    .stage{border-radius:18px 18px 0 0;padding:20px 12px 0}
  }
  @media (max-width:480px){
    .ctas{gap:6px;align-items:center}
    .btn{height:42px;font-size:15px}
    .btn-primary{gap:10px;padding:0 16px 0 6px}
    .btn-primary .arrow{width:30px;height:30px}
    .btn-secondary{padding:0 6px;gap:4px}
  }
</style>
</head>
<body>
  <header class="site-header">
    <div class="wrap nav">
      <a class="brand" href="#" aria-label="Nomi home">Nomi</a>
      <nav class="links" id="site-nav" aria-label="Primary">
        <a href="#" aria-current="page">Home</a>
        <a href="#use-cases">Use cases</a>
        <a href="#pricing">Pricing</a>
        <a href="#blog">Blog</a>
      </nav>
      <div class="nav-end">
        <a class="cta-sm" href="#">Download</a>
        <button class="menu-btn" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Menu"><i></i><i></i></button>
      </div>
    </div>
  </header>
  <section class="hero" data-memory-field>
    <div class="wrap">
      <div class="hero-top">
        <h1 data-stitch-reveal data-stitch-delay="150">Remembers what you see.</h1>
        <p class="sub" data-stitch-reveal data-stitch-delay="650" data-stitch-thread="#b3a597">Nomi is a Mac app that remembers what you see and answers from it. Your memory stays on your Mac.</p>
      </div>
      <div class="ctas">
        <a class="btn btn-primary" data-rise style="--d:1.15s" href="#"><span class="arrow" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg></span>Download for Mac</a>
        <a class="btn btn-secondary" href="#demo" data-rise style="--d:1.25s">See it in action</a>
      </div>
      <div class="stage" id="demo">
        <div class="mac-mock" data-mac-island data-start-delay="2900"></div>
      </div>
    </div>
  </section>
  <footer class="wrap footer">
    <span>© 2026 Nomi</span>
    <nav aria-label="Legal">
      <a href="../privacy">Privacy</a>
      <a href="../terms">Terms</a>
      <a href="mailto:yang@get-nomi.app">Contact</a>
    </nav>
  </footer>
  <script src="memory-field.js?v=3"></script>
  <script src="stitch-reveal.js?v=4"></script>
  <script>
    const header = document.querySelector(".site-header"), menu = header.querySelector(".menu-btn");
    const setMenu = open => { header.toggleAttribute("data-open", open); menu.setAttribute("aria-expanded", open); };
    menu.addEventListener("click", () => setMenu(!header.hasAttribute("data-open")));
    header.querySelectorAll(".links a").forEach(a => a.addEventListener("click", () => setMenu(false)));
    addEventListener("keydown", e => e.key === "Escape" && setMenu(false));
    const html = document.documentElement;
    if ("intro" in html.dataset) requestAnimationFrame(() => requestAnimationFrame(() => { html.dataset.intro = "go"; }));
  </script>
  <script src="cat-sprites.js?v=1"></script>
  <script src="island.js?v=5"></script>
</body>
</html>
