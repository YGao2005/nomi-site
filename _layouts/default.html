<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}Nomi</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="preload" href="{{ '/assets/home/fonts/DMSans-Medium.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}?v=1">
</head>
<body>
  <header class="wrap nav">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Nomi home">Nomi</a>
    {% unless page.layout == "notice" %}<a class="cta-sm" href="https://github.com/YGao2005/nomi-releases/releases">Download</a>{% endunless %}
  </header>
  <main class="{% if page.layout == 'notice' %}notice{% else %}doc{% endif %}">
{{ content }}
  </main>
  <footer class="wrap footer">
    <span>© 2026 Nomi</span>
    <nav aria-label="Legal">
      <a href="{{ '/privacy' | relative_url }}">Privacy</a>
      <a href="{{ '/terms' | relative_url }}">Terms</a>
      <a href="mailto:yang@get-nomi.app">Contact</a>
    </nav>
  </footer>
</body>
</html>
